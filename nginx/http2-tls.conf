# Servidor 2: HTTPS com TLS 1.3 + HTTP/2 (ALPN h2) sobre TCP 443.
# Montado em /etc/nginx/conf.d/default.conf (substitui o default.conf do nginx:alpine).
server {
    listen 443 ssl;
    http2 on;                      # requer nginx >= 1.25.1 (nginx:alpine atual atende)
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.3;   # TLS 1.3 obrigatório pelo enunciado
    ssl_session_tickets off;       # evita retomada de sessão (mantém handshake "frio" honesto)
    ssl_session_cache   off;

    root /usr/share/nginx/html;

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        gzip off;                  # arquivos aleatórios; sem compressão
    }
}
